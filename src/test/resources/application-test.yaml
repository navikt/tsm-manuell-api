spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9999
    security:
      protocol: plaintext
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080
          jwk-set-uri: http://localhost:8080/jwks
          audiences: test-audience
      client:
        provider:
          aad:
            token-uri: http://localhost:8080/token
            authorization-uri: http://localhost:8080/authorize
        registration: {}

azure:
  openid:
    config:
      issuer: http://localhost:8080
  app:
    client:
      id: test-client-id
      secret: test-client-secret

nais:
  token_endpoint: "http://localhost:8084/nais/token"
  cluster: "cluster-test-name"

kafka:
  topics:
    sykmeldinger: "topic-test-sykmeldinger"

services:
  gosys:
    oppgave:
      url: "http://localhost:8080"

tsmpdl:
  scope: test-scope